# render.yaml — Render Blueprint
services:
  - type: web
    name: campus-service
    runtime: node
    plan: free
    region: singapore
    rootDir: labs/week-13/source
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # ⭐ Challenge · ให้ Render สุ่ม JWT_SECRET ใหม่ให้โปรเจกต์นี้
      - key: JWT_SECRET
        generateValue: true
      # ⭐⭐ Challenge Turso — sync: false = Render ถามค่าตอนสร้าง · ไม่ commit ค่า
      # - key: TURSO_DATABASE_URL
      #   sync: false
      # - key: TURSO_AUTH_TOKEN
      #   sync: false
